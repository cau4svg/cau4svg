<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cauã Alves GitHub profile banner</title>
  <desc id="desc">Clean tech banner for a junior developer focused on infrastructure, automation, APIs, backend and security fundamentals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="0.52" stop-color="#132F3A"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 80) rotate(138) scale(420 220)">
      <stop stop-color="#5EEAD4" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="32" fill="url(#glow)"/>
  <path d="M0 284C134 232 258 318 402 274C548 230 624 104 782 96C930 88 1024 220 1200 172V360H0V284Z" fill="#020617" opacity="0.38"/>
  <path d="M78 82H358" stroke="#99F6E4" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <path d="M78 278H520" stroke="#99F6E4" stroke-width="2" stroke-linecap="round" opacity="0.18"/>

  <g filter="url(#shadow)">
    <rect x="762" y="72" width="334" height="216" rx="24" fill="#0F172A" fill-opacity="0.68" stroke="#5EEAD4" stroke-opacity="0.24"/>
    <circle cx="804" cy="114" r="7" fill="#64748B"/>
    <circle cx="828" cy="114" r="7" fill="#0F766E"/>
    <circle cx="852" cy="114" r="7" fill="#5EEAD4"/>
    <path d="M804 166L854 192L804 218" stroke="#5EEAD4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M886 222H1018" stroke="#E2E8F0" stroke-width="9" stroke-linecap="round"/>
    <path d="M886 162H1042" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M886 190H1008" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.58"/>
    <path d="M804 252H1052" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="80" y="134" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">Cauã Alves</text>
  <text x="82" y="178" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">Junior Developer • Infrastructure • Automation</text>
  <text x="82" y="220" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="18">APIs, backend, integrations and security fundamentals.</text>

  <g opacity="0.82">
    <rect x="82" y="246" width="74" height="30" rx="15" fill="#ECFEFF" fill-opacity="0.11" stroke="#A7F3D0" stroke-opacity="0.22"/>
    <text x="104" y="267" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">APIs</text>
    <rect x="170" y="246" width="112" height="30" rx="15" fill="#ECFEFF" fill-opacity="0.11" stroke="#A7F3D0" stroke-opacity="0.22"/>
    <text x="190" y="267" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Automation</text>
    <rect x="296" y="246" width="104" height="30" rx="15" fill="#ECFEFF" fill-opacity="0.11" stroke="#A7F3D0" stroke-opacity="0.22"/>
    <text x="318" y="267" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Backend</text>
    <rect x="414" y="246" width="104" height="30" rx="15" fill="#ECFEFF" fill-opacity="0.11" stroke="#A7F3D0" stroke-opacity="0.22"/>
    <text x="435" y="267" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Security</text>
