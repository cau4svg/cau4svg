<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">cau4svg GitHub profile banner</title>
  <desc id="desc">Modern professional banner focused on APIs, automations, backend and integrations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.54" stop-color="#134E4A"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 72) rotate(136.8) scale(460 220)">
      <stop stop-color="#5EEAD4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="32" fill="url(#glow)"/>
  <path d="M0 280C142 226 254 332 400 278C558 220 628 72 792 88C924 101 1008 226 1200 178V360H0V280Z" fill="#042F2E" opacity="0.42"/>
  <path d="M80 86H354" stroke="#99F6E4" stroke-width="2" stroke-linecap="round" opacity="0.42"/>
  <path d="M80 272H520" stroke="#99F6E4" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

  <g filter="url(#softShadow)">
    <rect x="766" y="74" width="328" height="210" rx="24" fill="#0F172A" fill-opacity="0.62" stroke="#5EEAD4" stroke-opacity="0.28"/>
