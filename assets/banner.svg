  <text x="82" y="188" fill="#CCFBF1" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">APIs • Automacoes • Backend • Integracoes</text>
  <text x="82" y="232" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="18">Construindo solucoes tecnicas claras, modernas e confiaveis.</text>

