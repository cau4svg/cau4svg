<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">cau4svg dark cybersecurity banner</title>
  <desc id="desc">Dark cybersecurity GitHub banner with terminal, logs, network nodes, API requests, lock, circuits and neon green blue accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020403"/>
      <stop offset="0.48" stop-color="#061013"/>
      <stop offset="1" stop-color="#071B2A"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 104) rotate(35) scale(500 210)">
      <stop stop-color="#00FF88" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 82) rotate(143) scale(430 210)">
      <stop stop-color="#00BFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00BFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#12312A" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)" opacity="0.52"/>
  <rect width="1200" height="360" rx="28" fill="url(#greenGlow)"/>
  <rect width="1200" height="360" rx="28" fill="url(#blueGlow)"/>

  <path d="M0 286C146 238 250 314 404 270C548 229 610 104 770 94C924 84 1014 210 1200 166V360H0V286Z" fill="#000000" opacity="0.35"/>

  <g opacity="0.42">
    <path d="M60 72H330M60 288H490M806 306H1138" stroke="#00FF88" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M866 70H1116" stroke="#00BFFF" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M872 94L940 132L1016 102L1088 154" stroke="#00BFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="872" cy="94" r="5" fill="#00BFFF"/>
    <circle cx="940" cy="132" r="5" fill="#00FF88"/>
    <circle cx="1016" cy="102" r="5" fill="#00BFFF"/>
    <circle cx="1088" cy="154" r="5" fill="#00FF88"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="736" y="86" width="356" height="190" rx="18" fill="#050B0E" fill-opacity="0.82" stroke="#00FF88" stroke-opacity="0.34"/>
    <rect x="736" y="86" width="356" height="36" rx="18" fill="#071B2A" fill-opacity="0.82"/>
    <circle cx="762" cy="104" r="5" fill="#FF4D4D" opacity="0.72"/>
    <circle cx="782" cy="104" r="5" fill="#FFD166" opacity="0.72"/>
    <circle cx="802" cy="104" r="5" fill="#00FF88" opacity="0.72"/>
    <text x="760" y="154" fill="#00FF88" font-family="Consolas, 'Courier New', monospace" font-size="16">GET /api/status 200</text>
    <text x="760" y="184" fill="#9CA3AF" font-family="Consolas, 'Courier New', monospace" font-size="15">auth: token verified</text>
    <text x="760" y="214" fill="#00BFFF" font-family="Consolas, 'Courier New', monospace" font-size="15">job: workflow.sync()</text>
    <text x="760" y="244" fill="#E5E7EB" font-family="Consolas, 'Courier New', monospace" font-size="15">trace: automation ready</text>
  </g>

  <g opacity="0.9">
    <path d="M631 146V128C631 105 650 86 673 86C696 86 715 105 715 128V146" stroke="#00FF88" stroke-width="8" stroke-linecap="round"/>
    <rect x="612" y="144" width="122" height="92" rx="18" fill="#061013" stroke="#00FF88" stroke-width="4"/>
    <circle cx="673" cy="184" r="12" fill="#00BFFF"/>
    <path d="M673 196V214" stroke="#00BFFF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="76" y="134" fill="#E5E7EB" font-family="Consolas, 'Courier New', monospace" font-size="28" font-weight="700">&gt; whoami</text>
  <text x="76" y="196" fill="#00FF88" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-2">cau4svg</text>
  <text x="82" y="238" fill="#B7F7D4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">APIs &#8226; Security &#8226; Automation &#8226; Backend</text>
  <text x="82" y="274" fill="#9CA3AF" font-family="Consolas, 'Courier New', monospace" font-size="17">infra mindset / secure habits / useful scripts / clean docs</text>

  <g opacity="0.34">
    <text x="74" y="324" fill="#00BFFF" font-family="Consolas, 'Courier New', monospace" font-size="13">[logs] request accepted :: build practical tools :: automate repetitive workflows</text>
  </g>
</svg>
